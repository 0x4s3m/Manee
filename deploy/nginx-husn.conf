# Husn (حصن) — nginx reverse proxy template.
# Replace __DOMAIN__ with your real domain. install.sh does this for you
# when invoked with HUSN_DOMAIN=foo.bar HUSN_WITH_NGINX=yes.
#
# After install: enable HTTPS via certbot:
#   sudo certbot --nginx -d __DOMAIN__

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Frontend (React build served by husn-frontend.service on :5173)
    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend API — same origin under /api so the frontend can call
    # window.location.origin without CORS surprises.
    # The frontend's VITE_API_BASE should be set to https://__DOMAIN__/api
    # at build time, and the trailing /api here is stripped by the rewrite.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Don't expose the vulnerable demo target to the public internet.
    # vuln_app.py listens on :9000 — bind it to 127.0.0.1 only when on a public host.
}
